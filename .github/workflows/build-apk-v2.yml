name: Build APK V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q cashier-mahamak-cloud-build.zip -d project
          if [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix duplicate theme
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          styles = Path("app/src/main/res/values/styles.xml")
          themes = Path("app/src/main/res/values/themes.xml")

          if styles.exists() and themes.exists():
              sroot = ET.parse(styles).getroot()
              names = {
                  e.attrib.get("name")
                  for e in sroot
                  if e.tag == "style"
              }

              if "Theme.CashierMahamk" in names:
                  tree = ET.parse(themes)
                  root = tree.getroot()

                  for e in list(root):
                      if e.tag == "style" and e.attrib.get("name") == "Theme.CashierMahamk":
                          root.remove(e)

                  tree.write(themes, encoding="utf-8", xml_declaration=True)
                  print("Duplicate theme fixed")
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashier-mahamak-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
